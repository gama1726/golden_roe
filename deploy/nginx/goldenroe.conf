# Production example. Docker is only for local MySQL.
# Replace the domain, PHP socket and certificate paths.
# Public site: goldenroe.ru -> Next.js on 127.0.0.1:3000
# Admin: admin.goldenroe.ru serves the built SPA and proxies API calls,
# so the browser stays on one origin and the Sanctum cookie works.
# API: 127.0.0.1:8080, not published to the internet.

upstream goldenroe_next {
    server 127.0.0.1:3000;
}

upstream goldenroe_api {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name goldenroe.ru www.goldenroe.ru admin.goldenroe.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name goldenroe.ru www.goldenroe.ru;

    ssl_certificate /etc/letsencrypt/live/goldenroe.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenroe.ru/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://goldenroe_next;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.goldenroe.ru;

    ssl_certificate /etc/letsencrypt/live/goldenroe.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldenroe.ru/privkey.pem;

    root /var/www/goldenroe/admin/dist;
    index index.html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://goldenroe_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sanctum/ {
        proxy_pass http://goldenroe_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://goldenroe_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name api.internal;
    root /var/www/goldenroe/backend/public;
    index index.php;

    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
