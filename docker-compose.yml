services:
  mysql:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: golden_roe
      MYSQL_USER: golden
      MYSQL_PASSWORD: golden
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7-alpine

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: golden_roe
      DB_USERNAME: golden
      DB_PASSWORD: golden
      REDIS_HOST: redis
      APP_URL: http://127.0.0.1:8000
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/revalidate
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "docker/healthcheck.php"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_URL: http://backend:8000
      # Use `${VAR-default}` (not `:-`) so an empty .env value keeps same-origin API calls.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-http://127.0.0.1:8000}
      SITE_URL: ${SITE_URL:-http://127.0.0.1:3000}
      FRONTEND_MODE: ${FRONTEND_MODE:-dev}
      FRONTEND_REBUILD: ${FRONTEND_REBUILD:-0}
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_HMR_HOST: ${VITE_HMR_HOST:-}
      VITE_HMR_PROTOCOL: ${VITE_HMR_PROTOCOL:-}
      VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
  admin_node_modules:
