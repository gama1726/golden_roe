services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: golden_roe
      MYSQL_USER: golden
      MYSQL_PASSWORD: golden
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: golden_roe
      DB_USERNAME: golden
      DB_PASSWORD: golden
      REDIS_HOST: redis
      APP_URL: http://127.0.0.1:8000
      FRONTEND_REVALIDATE_URL: http://frontend:3000/api/revalidate
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      SITE_URL: http://127.0.0.1:3000
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: ./admin
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  backend_vendor:
  frontend_node_modules:
  admin_node_modules:
